<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>業務報帳通</title>
<meta name="theme-color" content="#0E6B5A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root {
  --bg: #EEF2F1;
  --surface: #FFFFFF;
  --surface-2: #F5F8F7;
  --ink: #14211E;
  --muted: #5B6B66;
  --line: #D4DDDA;
  --accent: #0E6B5A;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEEE9;
  --stamp: #B3261E;
  --ok: #1B7A4A;
  --ok-soft: #E1F2E8;
  --warn: #8F5B0B;
  --warn-soft: #FBF0DC;
  --bad: #B3261E;
  --bad-soft: #FBE4E1;
  --info: #2F5E8A;
  --info-soft: #E3ECF6;
  --shadow: 0 1px 2px rgba(20,33,30,.06), 0 6px 20px rgba(20,33,30,.06);
  --radius: 10px;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F1715; --surface: #16211E; --surface-2: #1C2926; --ink: #E4EEEB; --muted: #93A5A0;
    --line: #2C3B37; --accent: #4FC3A6; --accent-ink: #0B1A16; --accent-soft: #173A33; --stamp: #F07A6E;
    --ok: #5BCB8C; --ok-soft: #173325; --warn: #E0A84A; --warn-soft: #3A2C12; --bad: #F07A6E; --bad-soft: #3D1B18;
    --info: #8DB8E6; --info-soft: #1A2A3B; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1715; --surface: #16211E; --surface-2: #1C2926; --ink: #E4EEEB; --muted: #93A5A0;
  --line: #2C3B37; --accent: #4FC3A6; --accent-ink: #0B1A16; --accent-soft: #173A33; --stamp: #F07A6E;
  --ok: #5BCB8C; --ok-soft: #173325; --warn: #E0A84A; --warn-soft: #3A2C12; --bad: #F07A6E; --bad-soft: #3D1B18;
  --info: #8DB8E6; --info-soft: #1A2A3B; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.6;
  padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
}
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ---------- header ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--serif); font-weight: 900; font-size: 18px;
}
.brand h1 { font-family: var(--serif); font-size: 19px; margin: 0; letter-spacing: .04em; }
.brand .co { font-size: 12px; color: var(--muted); line-height: 1.2; }
.role-switch { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface-2); }
.role-switch button {
  border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--muted);
}
.role-switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* ---------- nav ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs-inner { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
.tabs button {
  border: 0; background: transparent; padding: 8px 2px 10px; cursor: pointer; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px;
}
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; }
@media (min-width: 900px) {
  body { padding-bottom: 32px; }
  .tabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 55px); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); z-index: 19; }
  .tabs button { flex-direction: row; justify-content: center; gap: 8px; font-size: 14px; padding: 10px 4px; }
  .tabs button svg { width: 18px; height: 18px; }
  .tabs button[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--accent); }
}

main { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 24px; }
.view { display: grid; gap: 16px; }
h2 { font-family: var(--serif); font-size: 22px; margin: 0; letter-spacing: .03em; text-wrap: balance; }
h3 { font-size: 16px; margin: 0; text-wrap: balance; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.panel > * + * { margin-top: 12px; }

.sample-banner {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  background: var(--info-soft); color: var(--info); border-radius: var(--radius); padding: 10px 14px; font-size: 14px;
}
.sample-banner span { flex: 1; min-width: 200px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.kpi .label { font-size: 12px; color: var(--muted); }
.kpi .value { font-family: var(--mono); font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .hint { font-size: 12px; color: var(--muted); }

/* ---------- pills / stamps ---------- */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 9px; border-radius: 999px; white-space: nowrap; font-weight: 500; }
.pill.draft { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.submitted { background: var(--info-soft); color: var(--info); }
.pill.approved { background: var(--ok-soft); color: var(--ok); }
.pill.rejected { background: var(--bad-soft); color: var(--bad); }
.pill.posted { background: var(--accent-soft); color: var(--accent); }
.pill.tax { background: var(--ok-soft); color: var(--ok); }
.pill.notax { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--line); }
.pill.err { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.stamp {
  display: inline-block; font-family: var(--serif); font-weight: 900; color: var(--stamp);
  border: 2px solid var(--stamp); border-radius: 6px; padding: 0 8px; transform: rotate(-6deg);
  letter-spacing: .15em; font-size: 14px; opacity: .88;
}

/* ---------- list ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters input, .filters select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.filters input { flex: 1 1 200px; }
.ledger { display: grid; gap: 8px; }
.row {
  display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; text-align: left; width: 100%;
}
.row:hover { border-color: var(--accent); }
.thumb {
  width: 56px; height: 56px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line);
  object-fit: cover; display: grid; place-items: center; color: var(--muted); font-size: 11px; overflow: hidden;
}
.row .main { min-width: 0; }
.row .line1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row .seller { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.row .line2 { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.row .amt { text-align: right; }
.row .amt .total { font-family: var(--mono); font-weight: 600; font-size: 16px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }

/* ---------- form ---------- */
.capture-grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .capture-grid { grid-template-columns: minmax(0, 1fr); } }
.dropzone {
  border: 2px dashed var(--line); border-radius: var(--radius); background: var(--surface);
  min-height: 220px; display: grid; place-items: center; text-align: center; padding: 16px; position: relative;
}
.dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
.dropzone img { max-height: 420px; border-radius: 6px; }
.dropzone .dz-actions { display: grid; gap: 8px; justify-items: center; }
.scan-note { font-size: 13px; padding: 8px 10px; border-radius: 8px; }
.scan-note.ok { background: var(--ok-soft); color: var(--ok); }
.scan-note.warn { background: var(--warn-soft); color: var(--warn); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
@media (max-width: 520px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.field { display: grid; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea {
  width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2);
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.field input.mono { letter-spacing: .04em; }
.field .help { font-size: 12px; color: var(--muted); }
.field.bad input { border-color: var(--bad); }
.amount-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; grid-column: 1 / -1; }
@media (max-width: 520px) { .amount-row { grid-template-columns: minmax(0, 1fr); } }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-weight: 700; font-size: 14px; margin-bottom: 8px; padding: 0; }

.checks { display: grid; gap: 6px; list-style: none; padding: 0; margin: 0; }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 6px; font-size: 14px; align-items: start; }
.checks .ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-top: 2px; }
.checks .ok .ic { background: var(--ok-soft); color: var(--ok); }
.checks .warn .ic { background: var(--warn-soft); color: var(--warn); }
.checks .error .ic { background: var(--bad-soft); color: var(--bad); }
.checks .info .ic { background: var(--info-soft); color: var(--info); }
.sticky-actions {
  position: sticky; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; box-shadow: var(--shadow);
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.sticky-actions .sum { margin-right: auto; font-size: 13px; }
@media (min-width: 900px) { .sticky-actions { bottom: 12px; } }

/* ---------- table ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { background: var(--surface-2); font-weight: 700; color: var(--muted); font-size: 12px; letter-spacing: .04em; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tfoot td { font-weight: 700; background: var(--surface-2); }

/* ---------- drawer ---------- */
.overlay { position: fixed; inset: 0; background: rgba(8,15,13,.45); z-index: 40; display: flex; justify-content: flex-end; }
.drawer {
  width: min(560px, 100%); height: 100%; background: var(--bg); overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  display: flex; flex-direction: column; gap: 14px;
}
.drawer > * { flex-shrink: 0; }
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.kv { margin: 0; display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.timeline li { font-size: 13px; display: grid; grid-template-columns: 116px 1fr; gap: 8px; }
.timeline .when { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.decision textarea { width: 100%; min-height: 64px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.items-table td { white-space: normal; }

/* ---------- guide ---------- */
.guide { display: grid; gap: 16px; }
.guide p, .guide li { max-width: 72ch; }
.guide ul { padding-left: 1.2em; margin: 6px 0; }
.compare td { white-space: normal; min-width: 150px; vertical-align: top; }
.compare td:first-child { font-weight: 700; min-width: 110px; }
.law { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; }
.flow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.flow .step { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.flow .arrow { color: var(--muted); }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; box-shadow: var(--shadow);
  max-width: calc(100% - 32px);
}

/* ---------- camera ---------- */
.camera { position: fixed; inset: 0; background: #000; z-index: 50; display: grid; grid-template-rows: 1fr auto; }
.camera video { width: 100%; height: 100%; object-fit: cover; }
.camera .cam-bar { display: flex; gap: 8px; justify-content: space-between; align-items: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: #000; color: #fff; }
.camera .cam-bar .btn { background: #fff; color: #000; border-color: #fff; }

/* ---------- print ---------- */
#printArea { display: none; }
@media print {
  body { background: #fff; color: #000; padding: 0; }
  .topbar, .tabs, main, .toast, .overlay { display: none !important; }
  #printArea { display: block; font-family: var(--sans); color: #000; }
  #printArea h1 { font-family: var(--serif); text-align: center; font-size: 22px; margin: 0 0 4px; letter-spacing: .3em; }
  #printArea table { font-size: 11px; }
  #printArea th, #printArea td { border: 1px solid #555; color: #000; background: #fff; white-space: normal; }
  #printArea .sign { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 18px; border: 1px solid #555; }
  #printArea .sign div { border-right: 1px solid #555; height: 80px; padding: 4px 8px; font-size: 12px; }
  #printArea .sign div:last-child { border-right: 0; }
  #printArea .att { page-break-before: always; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #printArea .att figure { margin: 0; border: 1px solid #999; padding: 4px; break-inside: avoid; }
  #printArea .att img { max-height: 110mm; display: block; margin: 0 auto; }
  #printArea figcaption { font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">帳</div>
      <div>
        <h1>業務報帳通</h1>
        <div class="co" id="brandCo"></div>
      </div>
    </div>
    <div class="role-switch" role="group" aria-label="切換身分">
      <button type="button" data-role="sales">業務</button>
      <button type="button" data-role="manager">主管</button>
      <button type="button" data-role="accountant">會計</button>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="主要功能">
  <div class="tabs-inner">
    <button type="button" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>總覽</button>
    <button type="button" data-tab="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>新增憑證</button>
    <button type="button" data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>報帳單</button>
    <button type="button" data-tab="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M4 10h16M10 4v16"/></svg>會計彙整</button>
    <button type="button" data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>法規與做法</button>
    <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>設定</button>
  </div>
</nav>

<main id="app"></main>
<div id="printArea"></div>
<div id="overlayRoot"></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
"use strict";
/* =========================================================
 * 業務報帳通 — 發票／收據線上報帳（台灣營業稅規範）
 * 純前端、離線可用；資料存於本機 IndexedDB。
 * ========================================================= */

const IN_FRAME = (() => { try { return window.self !== window.top; } catch { return true; } })();
const TAX_RATE = 0.05;

/* ---------- 憑證種類 ---------- */
const DOC_TYPES = {
  einvoice:   { label: "電子發票證明聯", invoice: true,  deductible: true,  taxIncluded: false, hint: "可掃描左側 QR Code 自動帶入" },

// 營利事業統一編號檢查碼（財政部 2023 年起新規則：總和可被 5 整除）
function isValidBan(ban) {
  if (!/^\d{8}$/.test(ban)) return false;
  const w = [1, 2, 1, 2, 1, 2, 4, 1];
  let sum = 0;
  for (let i = 0; i < 8; i++) {
    let p = +ban[i] * w[i];
    p = Math.floor(p / 10) + (p % 10);
    if (p >= 10) p = Math.floor(p / 10) + (p % 10);
    sum += p;
  }
  if (sum % 5 === 0) return true;
  return ban[6] === "7" && (sum - 1) % 5 === 0;
}
// 由前 7 碼找出合法的第 8 碼（僅供產生範例資料）
function makeBan(seven) {
  for (let d = 0; d <= 9; d++) if (isValidBan(seven + d)) return seven + d;
  return makeBan(String((+seven + 1) % 1e7).padStart(7, "0"));
}
const isInvoiceNo = s => /^[A-Z]{2}\d{8}$/.test(s);

const pad2 = n => String(n).padStart(2, "0");
function parseYmd(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  return m ? { y: +m[1], m: +m[2], d: +m[3] } : null;
}
function todayYmd() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function daysBetween(a, b) {
  const pa = parseYmd(a), pb = parseYmd(b);
  if (!pa || !pb) return 0;
  return Math.round((Date.UTC(pb.y, pb.m - 1, pb.d) - Date.UTC(pa.y, pa.m - 1, pa.d)) / 86400000);
}
// 營業稅每兩個月一期：key 例 "115-09" 代表 115 年 9-10 月
function periodKey(ymd) {
  const p = parseYmd(ymd);
  if (!p) return "";
  const start = p.m % 2 ? p.m : p.m - 1;
  return `${p.y - 1911}-${pad2(start)}`;
}
function periodLabel(key) {
  if (!key) return "—";
  const [y, m] = key.split("-").map(Number);
  return `${y}年 ${pad2(m)}-${pad2(m + 1)}月`;
}
function filingDeadline(key) {
  const [y, m] = key.split("-").map(Number);
  let fy = y + 1911, fm = m + 2;
  if (fm > 12) { fm -= 12; fy += 1; }
  return `${fy - 1911}年${fm}月15日`;
}
const rocDate = ymd => { const p = parseYmd(ymd); return p ? `${p.y - 1911}/${pad2(p.m)}/${pad2(p.d)}` : "—"; };
const money = n => (Number(n) || 0).toLocaleString("zh-TW");
const fmtInvNo = s => (isInvoiceNo(s) ? `${s.slice(0, 2)}-${s.slice(2)}` : s || "—");

/* ---------- 電子發票證明聯 QR Code 解析（財政部 QR Code 規格） ---------- */
function parseEinvoiceQR(texts) {
  const left = texts.find(t => /^[A-Z]{2}\d{8}\d{7}\d{4}[0-9A-Fa-f]{16}\d{16}/.test(t));
  if (!left) return null;
  const right = texts.find(t => t.startsWith("**"));
  const y = +left.slice(10, 13) + 1911;
  const out = {
    invoiceNo: left.slice(0, 10),
    date: `${y}-${left.slice(13, 15)}-${left.slice(15, 17)}`,
    randomCode: left.slice(17, 21),
    net: parseInt(left.slice(21, 29), 16),
    total: parseInt(left.slice(29, 37), 16),
    buyerBan: left.slice(37, 45) === "00000000" ? "" : left.slice(37, 45),
    sellerBan: left.slice(45, 53),
    items: [],
    qrRaw: left + (right ? "\n" + right : ""),
  };
  out.tax = out.total - out.net;
  const tail = left.slice(77).split(":");          // ["", 自行使用區, 品目筆數, 總品目筆數, 編碼, 品名, 數量, 單價, ...]
  let fields = tail.slice(5);
  if (right) fields = fields.concat(right.replace(/^\*\*:?/, "").split(":"));
  for (let i = 0; i + 2 < fields.length; i += 3) {
    const name = fields[i].trim();
    if (name) out.items.push({ name, qty: fields[i + 1], price: fields[i + 2] });
  }
  return out;
}

const Store = {
  db: null,
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("receipt-app", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("records", { keyPath: "id" });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch { this.db = null; }
  },
  tx(mode) { return this.db.transaction("records", mode).objectStore("records"); },
  async all() {
    if (!this.db) return [];
    try {
      return await new Promise((res, rej) => { const q = this.tx("readonly").getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    } catch { return []; }
  },
  async put(rec) {
    if (!this.db) return;
    try { await new Promise((res, rej) => { const q = this.tx("readwrite").put(rec); q.onsuccess = res; q.onerror = () => rej(q.error); }); } catch {}
  },
  async del(id) {
    if (!this.db) return;
    try { await new Promise((res, rej) => { const q = this.tx("readwrite").delete(id); q.onsuccess = res; q.onerror = () => rej(q.error); }); } catch {}
  },
};

/* =========================================================
 * 合規檢核（送出前自動檢查）
 * ========================================================= */
function isDeductible(r) {
  const t = DOC_TYPES[r.docType];
  const cat = catByCode[r.category];
  return !!(t && t.deductible && r.buyerBan && r.buyerBan === state.settings.companyBan && isValidBan(r.buyerBan) && !(cat && cat.nd));
}
function runChecks(r, excludeId) {
  const out = [];
  const add = (level, msg) => out.push({ level, msg });
  const t = DOC_TYPES[r.docType];
  const s = state.settings;
  const total = Number(r.total), net = Number(r.net), tax = Number(r.tax);

  if (!r.image) add("warn", "尚未附上憑證照片（會計與稽核需要影像佐證）");

  if (t.invoice) {
    if (!r.invoiceNo) add("error", "請填寫發票號碼");
    else if (!isInvoiceNo(r.invoiceNo)) add("error", "發票號碼格式應為 2 碼英文字軌 + 8 碼數字，例 AB12345678");
  }
  if (r.invoiceNo) {
    const dup = state.records.find(x => x.id !== excludeId && x.invoiceNo === r.invoiceNo && x.status !== "rejected");
    if (dup) add("error", `發票號碼 ${fmtInvNo(r.invoiceNo)} 已由 ${dup.applicant || "他人"} 報帳（重複報帳）`);
  }

  if (t.invoice || r.docType === "ticket") {
    if (!r.sellerBan) add(t.invoice ? "error" : "warn", "請填寫賣方統一編號");
    else if (!isValidBan(r.sellerBan)) add("error", `賣方統編 ${r.sellerBan} 檢查碼不正確，請確認是否輸入錯誤`);
  }
  if (!r.sellerName) add("warn", "請填寫商家名稱");

  if (t.deductible) {
    if (!r.buyerBan) add("warn", "憑證未載買方統編：進項稅額不得扣抵（營業稅法§33），僅能列費用");
    else if (r.buyerBan !== s.companyBan) add("error", `買方統編 ${r.buyerBan} 不是本公司統編 ${s.companyBan}`);
  }
  if (r.docType === "receipt") add("info", "收據須載明：本公司抬頭與統編、日期、品名金額、開立人姓名／地址並蓋章");
  if (r.docType === "novoucher") {
    add("info", "支出證明單僅限確實無法取得外部憑證時使用，須由經手人與主管簽章");
    if (!r.note || r.note.length < 6) add("error", "請於備註說明無法取得憑證的原因");
  }

  if (!(total > 0)) add("error", "請填寫總金額");
  else {
    if (net + tax !== total) add("error", `未稅金額 ${money(net)} + 稅額 ${money(tax)} ≠ 總額 ${money(total)}`);
    if (t.deductible && r.buyerBan && tax > 0) {
      const expect = t.taxIncluded ? Math.round(total / (1 + TAX_RATE) * TAX_RATE) : Math.round(net * TAX_RATE);
      if (Math.abs(expect - tax) > 1) add("warn", `稅額 ${money(tax)} 與 5% 試算 ${money(expect)} 不符，請核對`);
    }
    if (total > s.approvalLimit) add("info", `金額超過 ${money(s.approvalLimit)} 元，需主管核准`);
  }

  if (!r.date) add("error", "請填寫憑證日期");
  else {
    const age = daysBetween(r.date, todayYmd());
    if (age < 0) add("error", "憑證日期不可晚於今天");
    else if (age > s.submitDays) add("warn", `憑證日期已超過 ${s.submitDays} 天報帳期限（公司規定），需說明原因`);
    else if (periodKey(r.date) !== periodKey(todayYmd())) add("info", `屬 ${periodLabel(periodKey(r.date))} 憑證，會計將併入該期或次期申報`);
  }

  const cat = catByCode[r.category];
  if (cat && cat.nd && t.deductible) add("info", `科目「${cat.name}」屬${cat.nd}，進項稅額不得扣抵`);
  if (!r.purpose) add("error", "請填寫用途／事由（稅務查核必要資訊）");

  if (!out.some(c => c.level === "error" || c.level === "warn")) add("ok", "檢核通過，可送出審核");
  return out;
}

/* =========================================================
 * 影像處理與 QR 辨識
 * ========================================================= */
function loadImage(src) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = src; });
}
function compressImage(img, max = 1600, q = 0.82) {
  const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}
function decodeBytes(bytes, fallback) {
  if (!bytes) return fallback;
  const u8 = new Uint8Array(bytes);
  try { return new TextDecoder("utf-8", { fatal: true }).decode(u8); } catch {}
  try { return new TextDecoder("big5").decode(u8); } catch {}
  return fallback;
}
async function decodeQRCodes(source) {
  const found = new Set();
  const W = source.naturalWidth || source.videoWidth || source.width;
  const H = source.naturalHeight || source.videoHeight || source.height;
  if ("BarcodeDetector" in window) {
    try {
      const det = new BarcodeDetector({ formats: ["qr_code"] });
      (await det.detect(source)).forEach(b => found.add(b.rawValue));
    } catch {}
  }
  if (window.jsQR && found.size < 2) {
    // 電子發票證明聯左右各一個 QR，jsQR 一次只找一個，所以分區掃描
    const regions = [[0, 0, W / 2, H], [W / 2, 0, W / 2, H], [0, 0, W, H], [0, H / 3, W / 2, H * 2 / 3]];
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d", { willReadFrequently: true });
    outer: for (const target of [900, 1500]) {
      for (const [x, y, w, h] of regions) {
        const sc = Math.min(1, target / Math.max(w, h));
        c.width = Math.max(1, Math.round(w * sc)); c.height = Math.max(1, Math.round(h * sc));
        ctx.drawImage(source, x, y, w, h, 0, 0, c.width, c.height);
        const data = ctx.getImageData(0, 0, c.width, c.height);
        const code = jsQR(data.data, c.width, c.height, { inversionAttempts: "attemptBoth" });
        if (code) found.add(decodeBytes(code.binaryData, code.data));
        if (found.size >= 2) break outer;
      }
    }
  }
  return [...found];
}
function applyQR(texts) {
  const f = state.form;
  const p = parseEinvoiceQR(texts);
  if (!p) {
    f.scanMsg = texts.length
      ? { level: "warn", text: "有讀到 QR Code，但不是電子發票格式，請手動輸入。" }
      : { level: "warn", text: "照片中沒有辨識到電子發票 QR Code。可重拍（對準左側 QR）或手動輸入。" };
    return;
  }
  Object.assign(f, {
    docType: p.buyerBan ? "einvoice" : "duplicate",
    invoiceNo: p.invoiceNo, randomCode: p.randomCode, date: p.date,
    sellerBan: p.sellerBan, buyerBan: p.buyerBan,
    net: p.buyerBan ? p.net : p.total, tax: p.buyerBan ? p.tax : 0, total: p.total,
    items: p.items, qrRaw: p.qrRaw,
  });
  f.scanMsg = { level: "ok", text: `已由 QR Code 帶入：${fmtInvNo(p.invoiceNo)}，${money(p.total)} 元${p.items.length ? `，${p.items.length} 項品名` : ""}。請補上商家名稱與用途。` };
}

function toast(msg) {

function statusPill(s) { return `<span class="pill ${s}">${STATUS[s].label}</span>`; }
function taxPill(r) { return isDeductible(r) ? `<span class="pill tax">可扣抵 ${money(r.tax)}</span>` : `<span class="pill notax">不可扣抵</span>`; }

async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg || "已複製"); }
  catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(okMsg || "已複製"); } catch { toast("無法自動複製，請手動選取"); }

function download(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function handleImageFile(file) {
  if (!file || !file.type.startsWith("image/")) { toast("請選擇圖片檔"); return; }
  toast("辨識中…");
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    if (!state.form) state.form = blankForm();
    state.form.image = compressImage(img);
    const texts = await decodeQRCodes(img);
    applyQR(texts);
  } catch {
    toast("圖片讀取失敗，請換一張");
  } finally { URL.revokeObjectURL(url); }
  render();
}

/* ---------- 即時相機掃描（需 HTTPS，非內嵌頁面） ---------- */
async function liveScan() {
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } } }); }
  catch { toast("無法開啟相機，請改用「拍照或選擇圖片」"); return; }
  const root = $("#overlayRoot");
  root.innerHTML = `<div class="camera"><video playsinline muted></video><div class="cam-bar"><span id="camMsg">請對準電子發票左右兩個 QR Code</span><div class="btn-row"><button class="btn" id="camShot">直接拍照</button><button class="btn" id="camClose">關閉</button></div></div></div>`;
  const video = $("video", root);
  video.srcObject = stream; await video.play();
  let running = true, found = new Set(), firstHit = 0;
  const stop = () => { running = false; stream.getTracks().forEach(t => t.stop()); root.innerHTML = ""; };
  const snap = () => { const c = document.createElement("canvas"); c.width = video.videoWidth; c.height = video.videoHeight; c.getContext("2d").drawImage(video, 0, 0); return c; };
  const finish = async () => {
    const c = snap(); stop();
    if (!state.form) state.form = blankForm();
    state.form.image = compressImage(await loadImage(c.toDataURL("image/jpeg", 0.9)));
    applyQR([...found]); render();
  };
  $("#camClose").onclick = stop;
  $("#camShot").onclick = finish;
  const loop = async () => {
    if (!running) return;
    if (video.videoWidth) {
      (await decodeQRCodes(video)).forEach(t => found.add(t));
      const hasLeft = [...found].some(t => /^[A-Z]{2}\d{8}/.test(t));
      if (hasLeft && !firstHit) { firstHit = Date.now(); const m = $("#camMsg"); if (m) m.textContent = "已讀到發票資料，正在找右側品名 QR…"; }
      if (hasLeft && ([...found].some(t => t.startsWith("**")) || Date.now() - firstHit > 1500)) { await finish(); return; }
    }
    setTimeout(loop, 250);
  };
  loop();
}

function exportRows(period) {
  return state.records

}
function csvFor(rows) {
  const head = ["期別", "憑證日期", "憑證種類", "發票號碼", "賣方統編", "商家名稱", "買方統編", "未稅金額", "營業稅額", "總額", "可扣抵進項稅額", "不可扣抵原因", "科目代號", "科目名稱", "客戶/專案", "用途", "申請人", "部門", "狀態"];
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = rows.map(r => {
    const cat = catByCode[r.category] || {};
    const d = isDeductible(r);
    const why = d ? "" : !DOC_TYPES[r.docType].deductible ? "憑證種類不得扣抵" : !r.buyerBan ? "未載買方統編" : cat.nd ? cat.nd : "買方統編不符";
    return [periodLabel(periodKey(r.date)), rocDate(r.date), DOC_TYPES[r.docType].label, r.invoiceNo, r.sellerBan, r.sellerName, r.buyerBan, r.net, r.tax, r.total, d ? r.tax : 0, why, cat.code, cat.name, r.customer, r.purpose, r.applicant, r.department, STATUS[r.status].label].map(q).join(",");
  });
  return "﻿" + [head.join(",")].concat(lines).join("\r\n");
}

function render() {
  $("#brandCo").textContent = `${state.settings.companyName}・${state.settings.userName}`;
  $$(".role-switch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.role === state.role)));
  $$(".tabs button").forEach(b => (b.dataset.tab === state.tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
  const views = { home: viewHome, new: viewNew, list: viewList, export: viewExport, guide: viewGuide, settings: viewSettings };
  $("#app").innerHTML = views[state.tab]();
}
function go(tab) {
  state.tab = tab;
  Prefs.set("tab", tab);
  render();
  window.scrollTo({ top: 0 });
}

document.addEventListener("click", async e => {
  const tabBtn = e.target.closest(".tabs button");
  if (tabBtn) { go(tabBtn.dataset.tab); return; }
  const roleBtn = e.target.closest(".role-switch button");
  if (roleBtn) { state.role = roleBtn.dataset.role; Prefs.set("role", state.role); closeDetail(); render(); toast(`已切換為「${ROLE_LABEL[state.role]}」`); return; }

  const opener = e.target.closest("[data-open]");
  if (opener && !e.target.closest("[data-act]")) { openDetail(opener.dataset.open); return; }

  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "close-detail") { if (e.target === el || el.tagName === "BUTTON") closeDetail(); return; }
  const rec = el.dataset.id && state.records.find(r => r.id === el.dataset.id);

  switch (act) {
    case "go-new": state.form = blankForm(); go("new"); break;
    case "new-blank": state.form = blankForm(); render(); break;
    case "pick-photo": $("#fileInput").click(); break;
    case "live-scan": liveScan(); break;
    case "rescan": {
      const img = await loadImage(state.form.image);
      applyQR(await decodeQRCodes(img)); render(); break;
    }
    case "split-tax": splitTax(); break;
    case "save-draft":
    case "submit": {
      const f = state.form;
      const checks = runChecks(f, f.id);
      if (act === "submit" && hasError(checks)) { toast("還有未通過的檢核項目"); return; }
      const wasRejected = f.id && (state.records.find(r => r.id === f.id) || {}).status === "rejected";
      const r = formToRecord(f, act === "submit" ? "submitted" : "draft");
      if (!f.id) r.history.push({ at: nowIso(), by: ROLE_LABEL[state.role], action: "建立草稿", comment: "" });
      if (act === "submit") r.history.push({ at: nowIso(), by: ROLE_LABEL[state.role], action: wasRejected ? "補正後重新送出" : "送出審核", comment: "" });
      await saveRecord(r);
      state.form = blankForm();
      toast(act === "submit" ? "已送出，等待主管審核" : "已存為草稿");
      go(act === "submit" ? "list" : "home");
      break;
    }
    case "edit": {
      state.form = { ...blankForm(), ...rec, net: rec.net, tax: rec.tax, total: rec.total, scanMsg: null };
      closeDetail(); go("new"); break;
    }
    case "withdraw": await transition(rec, "draft", "撤回"); closeDetail(); render(); toast("已撤回為草稿"); break;
    case "delete": state.records = state.records.filter(r => r.id !== rec.id); await Store.del(rec.id); closeDetail(); render(); toast("已刪除"); break;
    case "approve": await transition(rec, "approved", "主管核准", $("#decisionComment").value.trim()); closeDetail(); render(); toast("已核准，轉會計入帳"); break;
    case "post": await transition(rec, "posted", "會計入帳", $("#decisionComment").value.trim()); closeDetail(); render(); toast("已入帳"); break;
    case "reject": {
      const c = $("#decisionComment").value.trim();
      if (!c) { $("#decisionComment").focus(); toast("請填寫退回原因"); return; }
      await transition(rec, "rejected", state.role === "manager" ? "主管退回" : "會計退回", c); closeDetail(); render(); toast("已退回給申請人"); break;
    }
    case "dl-csv": download(`進項明細_${state.exportPeriod}.csv`, csvFor(exportRows(state.exportPeriod)), "text/csv;charset=utf-8"); toast("已下載 CSV"); break;
    case "copy-csv": copyText(csvFor(exportRows(state.exportPeriod)).replace(/^﻿/, "").replace(/,/g, "\t"), "已複製，可直接貼到 Excel"); break;
    case "print": printReport(); break;
    case "backup": download(`報帳備份_${todayYmd()}.json`, JSON.stringify({ app: "receipt-app", version: 1, settings: state.settings, records: state.records }), "application/json"); toast("已下載備份檔"); break;
    case "restore": $("#importInput").click(); break;
    case "clear-sample":
      for (const r of state.records.filter(r => r.sample)) await Store.del(r.id);
      state.records = state.records.filter(r => !r.sample); Prefs.set("sampleCleared", true); render(); toast("已清除範例資料"); break;
    case "load-sample":
      for (const r of sampleRecords()) await saveRecord(r);
      render(); toast("已載入範例資料"); break;
    case "ask-wipe": $("#wipeConfirm").hidden = false; break;
    case "cancel-wipe": $("#wipeConfirm").hidden = true; break;
    case "wipe":
      for (const r of state.records) await Store.del(r.id);
      state.records = []; Prefs.set("sampleCleared", true); render(); toast("已清除全部資料"); break;
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.closest("#voucherForm") && t.name) {
    let v = t.value;
    if (t.name === "invoiceNo") { v = v.toUpperCase().replace(/[^A-Z0-9]/g, ""); if (v !== t.value) t.value = v; }
    if (t.name === "sellerBan" || t.name === "buyerBan") { v = v.replace(/\D/g, ""); if (v !== t.value) t.value = v; }
    state.form[t.name] = v;
    if (t.name === "total" && DOC_TYPES[state.form.docType].taxIncluded) splitTax();
    refreshChecks();
    return;
  }
  if (t.id === "flt-q") { state.filter.q = t.value; const pos = t.selectionStart; render(); const n = $("#flt-q"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.id === "banTest") {
    const v = t.value.replace(/\D/g, ""); t.value = v;
    $("#banTestOut").textContent = v.length < 8 ? "依財政部檢查碼規則驗證" : isValidBan(v) ? `${v} 檢查碼正確` : `${v} 檢查碼不正確`;
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "f-docType") {
    state.form.docType = t.value;
    const dt = DOC_TYPES[t.value];
    if (dt.deductible && !state.form.buyerBan) state.form.buyerBan = state.settings.companyBan;
    if (!dt.deductible) { state.form.net = Number(state.form.total) || ""; state.form.tax = 0; }
    render(); return;
  }
  if (t.id === "f-category") { state.form.category = t.value; refreshChecks(); return; }
  if (t.id === "flt-status") { state.filter.status = t.value; render(); return; }
  if (t.id === "flt-period") { state.filter.period = t.value; render(); return; }
  if (t.id === "exp-period") { state.exportPeriod = t.value; render(); return; }
  if (t.id === "fileInput") { const file = t.files[0]; t.value = ""; if (file) { if (state.tab !== "new") { state.form = blankForm(); state.tab = "new"; } await handleImageFile(file); } return; }
  if (t.id === "importInput") {
    const file = t.files[0]; t.value = "";
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (data.app !== "receipt-app" || !Array.isArray(data.records)) throw new Error();
      for (const r of data.records) await saveRecord(r);
      toast(`已還原 ${data.records.length} 筆`); render();
    } catch { toast("備份檔格式不正確"); }
  }
});
document.addEventListener("submit", e => {
  if (e.target.id === "settingsForm") {
    e.preventDefault();
    const fd = new FormData(e.target);
    const s = Object.fromEntries(fd.entries());
    s.approvalLimit = Number(s.approvalLimit) || DEFAULT_SETTINGS.approvalLimit;
    s.submitDays = Number(s.submitDays) || DEFAULT_SETTINGS.submitDays;
    state.settings = { ...state.settings, ...s };
    Prefs.set("settings", state.settings);
    render(); toast(isValidBan(state.settings.companyBan) ? "設定已儲存" : "已儲存，但公司統編檢查碼不正確");
  } else e.preventDefault();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

// 拖曳圖片
document.addEventListener("dragover", e => { const dz = e.target.closest && e.target.closest("#dropzone"); if (dz) { e.preventDefault(); dz.classList.add("drag"); } });
document.addEventListener("dragleave", e => { const dz = e.target.closest && e.target.closest("#dropzone"); if (dz) dz.classList.remove("drag"); });
document.addEventListener("drop", e => {
  const dz = e.target.closest && e.target.closest("#dropzone");
  if (!dz) return;
  e.preventDefault(); dz.classList.remove("drag");
  const file = e.dataTransfer.files[0]; if (file) handleImageFile(file);
});
// 貼上截圖（例如電子郵件中的電子發票）
document.addEventListener("paste", e => {
  if (state.tab !== "new") return;
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (item) { e.preventDefault(); handleImageFile(item.getAsFile()); }
});

/* ---------- 啟動 ---------- */
(async function init() {
  await Store.open();
  state.records = await Store.all();
  if (!state.records.length && !Prefs.get("sampleCleared", false)) {
    for (const r of sampleRecords()) await saveRecord(r);
  }
  const hash = location.hash.replace("#", "");
  state.tab = ["home", "new", "list", "export", "guide", "settings"].includes(hash) ? hash : Prefs.get("tab", "home");
  if (state.tab === "new") state.form = blankForm();
  render();
  if ("serviceWorker" in navigator && !IN_FRAME && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
